<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Contact Form</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.1/css/bootstrap-select.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.13.1/js/bootstrap-select.min.js"></script>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
    />

    <style>
       @media screen and (max-width:600px)
      { .outter{
         box-sizing: border-box;
        padding-left: 5%;
        padding-right:5%;
        margin: 5px;
        }
       }
      
      .outter {
        box-sizing: border-box;
        padding-left: 5%;
        
        margin: 5px;
      }
      .titleBlock {
        text-align: center;
      }

      .error {
        color: red;
        font-size: 12px;
        margin-top: -5px;
        margin-bottom: 10px;
      }
      .error-input {
        border: 1px solid red;
      }
      .btn-warning {
        background-color: #e57248 !important;
        border: none !important;
        color: white !important;
      }
      .btn-warning:hover {
        background-color: #e57248 !important;
      }
      .filter-option {
        background-color: white;
        border: 1px solid rgb(206, 212, 218);
        border-radius: 5px;
      }
      .btn:disabled {
        cursor: not-allowed;  
      }

      .danger-text{
        color: red;
      }

      .required{
        color: #e57248;
      }
      .selectdisabled {
      background-color: #e0e0e0;
      color: #9e9e9e;
      border: 1px solid #ccc;
      cursor: not-allowed;
      color: red
    }

  /* Dropdown Container */
  .dropdown-container {
    position: relative;
    display: inline-block;
    width: 100%;
  }

  /* Style for the Select Element */
  .dropdown-container select {
    appearance: none; /* Remove default arrow */
    -webkit-appearance: none; /* For Safari/Chrome */
    -moz-appearance: none; /* For Firefox */
    width: 100%;
    padding: 10px;
    padding-right: 30px; /* Space for the arrow */
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #fff;
    font-size: 16px;
    color: #333;
    cursor: pointer;
    background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Arrow_down_font_awesome.svg/1024px-Arrow_down_font_awesome.svg.png') no-repeat right 10px center;
    background-size: 16px;
  }

  /* Dropdown Focus Styling */
  .dropdown-container select:focus {
    border-color: #007BFF;
    outline: none;
  }


</style>  
  </head>
  <body>
    <div class="outter">
      <div class="titleBlock">
        <h6>
          Call 800-000-0000 for immediate service, or fill in the form below and
          we will contact you.
        </h6>
      </div>

      <div class="formOutterBlock">
        <form
          id="contactForm"
          novalidate
        >
          <!--Question1 dropdown menu-->
          <div class="form-row">
            <div class="container">
            <div class="form-group col-lg-auto">
              <select
                id="Question1"
                class="selectpicker"
                data-width="100%"
                title="*What option best describes your company's furnished housing
                needs?"
                single
                required
              >
                <option>Intern program</option>
                <option>Rotational program for project-based work</option>
                <option>Travel or temporary assignments</option>
                <option>Relocations</option>
                <option>I'm not sure</option>
              </select>
              <span
                id="question1Error"
                class="error"
              ></span>
            </div>
            </div>
          </div>

          <div class="form-row">
            <!--Firstname-->
            <div class="form-group col-md-6">
              <input
                type="text"
                class="form-control"
                id="FirstName"
                placeholder="*First Name"
                required
              />
              <span
                id="firstNameError"
                class="error"
              ></span>
            </div>
            <!--Lastname-->
            <div class="form-group col-md-6">
              <input
                type="text"
                class="form-control"
                id="LastName"
                placeholder="*Last Name"
                required
              />
              <span
                id="lastNameError"
                class="error"
              ></span>
            </div>
            <!--Email-->
            <div class="form-group col-md-12">
              <input
                type="email"
                class="form-control"
                id="Email"
                placeholder="*Email "
                required
              />
              <span
                id="emailError"
                class="error"
              ></span>
            </div>
            <!--Comapany-->
            <div class="form-group col-md-4">
              <input
                type="text"
                class="form-control"
                id="Company"
                placeholder="*Company"
                required
              />
              <span
                id="companyError"
                class="error"
              ></span>
            </div>
            <!--Title-->
            <div class="form-group col-md-4">
              <input
                type="text"
                class="form-control"
                id="Title"
                placeholder="*Title"
                required
              />
              <span
                id="titleError"
                class="error"
              >
            </span>
            </div>
            <!--Mobile-->
            <div class="form-group col-md-4">
              <input
                type="text"
                class="form-control"
                id="Phone"
                placeholder="Phone"
                pattern="^\d{10}$"
                required
              />
              <span
                id="phoneError"
                class="error"
              ></span>
            </div>
          </div>
            <!--Question2-->
            <div class="container-fluid">
                <div class="form-group .col-xl-auto">
              <select
                    class="selectpicker"
                    id="Question2"
                    data-width="100%"
                    data-container="body"             
                    multiple
                    title="How many months do you estimate will need housing this year?"                    
                  >
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                      <option value="5">May</option>
                      <option value="6">June</option>
                      <option value="7">July</option>
                      <option value="8">August</option>
                      <option value="9">September</option>
                      <option value="10">October</option>
                      <option value="11">November</option>
                      <option value="12">December</option>
                    </optgroup>
                  </select>
                </div>
                <div class="form-group .col-xl-auto">
                  <select
                    id="Question3"
                    class="selectpicker"
                    data-width="100%"
                    title="How many employees do you estimate will need housing this year?"
                  >
                    <option>Less than 20</option>
                    <option>20-50</option>
                    <option>More than 50</option>
                    <option>I'm not sure</option>
                  </select>
                </div>

            </div>
            
            <!--Question3-->
                      </div>
          

          <!--Caption Calendar submit-->
            <div
              class="form-group col-md-12 d-flex flex-wrap justify-content-between align-items-center"
            >
              <p class="mb-4">
                Fields marked with <span class="danger-text">*</span> are required.
              </p>      
              
                <div class="form-group col-md-1">

                  
                </div>      
              <button
                type="submit"
                class="btn btn-warning col-md-2 ml-auto"
              >
                Submit
              </button>
            </div>

          </div>
        </form>
    </div>

    <script>    
       $(document).ready(function () {
        // Initialize the selectpicker
        $(".selectpicker").selectpicker();
        $("#Question2").parent().hide();

        // Toggle visibility of Question2 based on Question1 selection
        $("#Question1").on("change", function () {
          const selectedValue = $(this).val();
          if (
            selectedValue === "Intern program" ||
            selectedValue === "Rotational program for project-based work"
               
          ) {
            $("#Question2").parent().show(); // Show Question2
      console.log("Question2 shown");
      $("#Question2").selectpicker("refresh");

          } 
          else {
            $("#Question2").parent().hide(); // Hide Question2
      $("#Question2").val(""); // Reset Question2's value when hidden
      $("#Question2").selectpicker("refresh"); // Refresh to reflect changes
      console.log("Question2 hidden");
                      }

        });
      }); 
      document
        .getElementById("contactForm")
        .addEventListener("submit", function (event) {
          let isValid = true;
          const fields = [
            {
              id: "FirstName",
              errorId: "firstNameError",
              message: "First name is required.",
            },
            {
              id: "LastName",
              errorId: "lastNameError",
              message: "Last name is required.",
            },
            {
              id: "Email",
              errorId: "emailError",
              message: "Please enter a valid email address.",
              regex: /^[^\s@]+@[^\s@]+\.[^\s@]+$/,
            },
            {
              id: "Phone",
              errorId: "phoneError",
              message: "Please enter a valid 10-digit phone number.",
              regex: /^\d{10}$/,
            },
            {
              id: "Question1",
              errorId: "question1Error",
              message: "Please select an option.",
            },
            {
              id: "Company",
              errorId: "companyError",
              message: "Company name is required.",
            },
            {
              id: "Title",
              errorId: "titleError",
              message: "Title is required.",
            },
          ];

          fields.forEach((field) => {
            const input = document.getElementById(field.id);
            const error = document.getElementById(field.errorId);

            if (
              !input.value.trim() ||
              (field.regex && !field.regex.test(input.value))
            ) {
              isValid = false;
              error.textContent = field.message;
              input.classList.add("error-input");
            } else {
              error.textContent = "";
              input.classList.remove("error-input");
            }
          });

          if (!isValid) {
            event.preventDefault();
          }
        });
        
    </script>
  </body>
</html>
